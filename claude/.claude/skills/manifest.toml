# Third-party Claude Code skills not managed by the `claude plugin` CLI.
#
# Custom user-authored skills (e.g. fobis, research-lookup) live as plain
# directories alongside this file and need no entry here — they are deployed
# by stow when this package is restowed.
#
# Plugin/marketplace skills are declared in `../settings.json` under
# `enabledPlugins` and installed by `skills-apply install`.
#
# Each entry below describes ONE loose skill with its install/update/uninstall
# commands. The commands are shell strings executed verbatim by skills-apply.
# Use `check` to detect whether the skill is already installed so install can
# be idempotent.

[skills.perplexity-search]
description = "Perplexity web search via OpenRouter (Python skill with .venv)"
# A .venv with litellm installed is the install marker. The SKILL.md and
# scripts live in the dotfiles repo (this skill ships its own Python sources),
# so install only needs to build the .venv and populate it.
check     = "test -x ~/.claude/skills/perplexity-search/.venv/bin/python"
install   = "python3 -m venv ~/.claude/skills/perplexity-search/.venv && ~/.claude/skills/perplexity-search/.venv/bin/pip install --quiet litellm python-dotenv"
update    = "~/.claude/skills/perplexity-search/.venv/bin/pip install --quiet --upgrade litellm python-dotenv"
uninstall = "rm -rf ~/.claude/skills/perplexity-search/.venv"

[skills.mattpocock-skills]
description = "Matt Pocock's engineering/productivity skills bundle (diagnose, grill-with-docs, tdd, to-prd, ...)"
# Bundle install: one git clone at ~/.local/share/claude-skills/mattpocock-skills,
# then symlink every SKILL.md dir into ~/.claude/skills/ via the upstream
# link-skills.sh (idempotent). Each linked subskill (diagnose, tdd, ...) will
# appear under "class A — custom" in `skills-apply status` since skills-apply
# keys class-C entries by name and the individual skill names don't match
# "mattpocock-skills" — that is a known cosmetic wart, not a bug.
check     = "test -d ~/.local/share/claude-skills/mattpocock-skills/.git"
install   = "git clone --depth 1 https://github.com/mattpocock/skills ~/.local/share/claude-skills/mattpocock-skills && bash ~/.local/share/claude-skills/mattpocock-skills/scripts/link-skills.sh"
update    = "git -C ~/.local/share/claude-skills/mattpocock-skills pull --ff-only && bash ~/.local/share/claude-skills/mattpocock-skills/scripts/link-skills.sh"
uninstall = "for l in ~/.claude/skills/*; do [ -L \"$l\" ] && case \"$(readlink -f \"$l\")\" in $HOME/.local/share/claude-skills/mattpocock-skills/*) rm \"$l\" ;; esac; done; rm -rf ~/.local/share/claude-skills/mattpocock-skills"

[skills.book-to-skill]
description = "Meta-skill that converts books/documents (PDF, EPUB, DOCX, ...) into structured Claude Code skills"
# Single-skill repo (no upstream link script): clone to the shared cache dir,
# then symlink the repo root into ~/.claude/skills/book-to-skill. The skill's
# SKILL.md resolves its bundled scripts/extract.py relative to that dir, so the
# symlink target MUST be the repo root. `ln -sfn` keeps re-installs idempotent
# (force + no-deref avoids nesting a link inside an existing symlinked dir).
# Python extraction deps (docling, pdftotext, ...) are optional and prompted
# for by extract.py at run time — not installed here.
check     = "test -d ~/.local/share/claude-skills/book-to-skill/.git"
install   = "git clone --depth 1 https://github.com/virgiliojr94/book-to-skill ~/.local/share/claude-skills/book-to-skill && ln -sfn ~/.local/share/claude-skills/book-to-skill ~/.claude/skills/book-to-skill"
update    = "git -C ~/.local/share/claude-skills/book-to-skill pull --ff-only && ln -sfn ~/.local/share/claude-skills/book-to-skill ~/.claude/skills/book-to-skill"
uninstall = "rm -f ~/.claude/skills/book-to-skill; rm -rf ~/.local/share/claude-skills/book-to-skill"

[skills.pdf-deps]
description = "Python runtime for the official `pdf` skill (document-skills plugin) — isolated venv"
# The official `pdf` skill (Class B plugin: document-skills@anthropic-agent-skills)
# ships only instructions; it calls bare `python3` and shells out to system tools.
# WSL2 system Python is externally-managed (PEP 668), so its libs go in a dedicated
# venv here, NOT system site-packages. When running the skill's snippets, invoke
# ~/.local/share/claude-skills/pdf-venv/bin/python explicitly (see SKILL note).
# System binaries (qpdf, tesseract-ocr, poppler-utils) are apt-managed per host,
# NOT owned here — apt isn't reproducible from this manifest by design.
# `pdf2image`+`pytesseract` need poppler+tesseract on PATH at run time.
check     = "test -x ~/.local/share/claude-skills/pdf-venv/bin/python && ~/.local/share/claude-skills/pdf-venv/bin/python -c 'import pypdf, pdfplumber, reportlab, pandas, pytesseract, pdf2image' 2>/dev/null"
install   = "python3 -m venv ~/.local/share/claude-skills/pdf-venv && ~/.local/share/claude-skills/pdf-venv/bin/pip install --quiet --upgrade pip && ~/.local/share/claude-skills/pdf-venv/bin/pip install --quiet pypdf pdfplumber reportlab pandas pytesseract pdf2image"
update    = "~/.local/share/claude-skills/pdf-venv/bin/pip install --quiet --upgrade pypdf pdfplumber reportlab pandas pytesseract pdf2image"
uninstall = "rm -rf ~/.local/share/claude-skills/pdf-venv"
