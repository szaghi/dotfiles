# astrobit — Sunshine. Desktop remoto di emergenza, non game streaming.
#
# Questa macchina pilota i telescopi: lo stream serve quando l'avvio automatico
# del rig fallisce e il guasto e' nella GUI (una dialog che blocca Ekos, un
# wizard della montatura). Le scelte qui privilegiano la leggibilita' del testo
# e il non rubare CPU alle riprese, non gli fps.
#
# NOTA: capture e encoder sono deliberatamente NON forzati. Impostare
# "capture = wlgrab" a mano fa fallire l'init con "Could not initialize display
# with the given hw device type": l'autodetect sceglie da solo wlgrab (niri
# espone zwlr_screencopy_manager_v1) e vaapi, verificato nei log all'avvio.

sunshine_name = astrobit

# ── QUALITA' ──────────────────────────────────────────────────────────────────
# Risoluzione, frame rate e bitrate NON si impostano qui: sono scelte del
# CLIENT. Moonlight su quark li negozia all'avvio dello stream e Sunshine si
# adatta. (fps/resolutions/min_bitrate esistono in altri progetti ma qui sono
# "Unrecognized configurable option" e vengono ignorati in silenzio.)
# Su quark impostare quindi: 1920x1080, 30 fps, ~15 Mbps.

# ── AUDIO ─────────────────────────────────────────────────────────────────────
# Niente audio da una macchina in giardino: toglierlo elimina un'intera classe
# di problemi (sink virtuali, desync) senza costare nulla.
stream_audio = disabled

# ── WEB UI ────────────────────────────────────────────────────────────────────
# La protezione CSRF rifiuta ogni richiesta la cui Origin non sia elencata qui,
# e il sintomo e' un loop di login: le credenziali vengono accettate ma la
# richiesta che stabilisce la sessione viene bloccata, quindi il browser torna
# alla pagina di accesso. Vanno elencate TUTTE le forme con cui si raggiunge la
# UI, perche' l'Origin e' la stringa digitata nella barra, non l'IP risolto.
csrf_allowed_origins = https://astrobit:47990,https://astrobit.local:47990,https://localhost:47990,https://127.0.0.1:47990,https://192.168.1.45:47990
