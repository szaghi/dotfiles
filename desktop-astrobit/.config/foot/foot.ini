# ~/.config/foot/foot.ini
# astrobit — foot + Solarized Dark (Ethan Schoonover)

[main]
font=monospace:size=12
# With a Nerd Font installed, e.g.:
# font=JetBrainsMono Nerd Font:size=12
pad=6x6
initial-window-size-chars=100x30
selection-target=both

# foot would default to term=foot, but the "foot" terminfo entry does not exist
# on the remote HPC hosts (Leonardo & co.), where an unknown TERM breaks curses
# applications over ssh. xterm-256color is the same compromise the alacritty
# config already makes. To use the real entry instead, install it once per host:
#   infocmp -x foot | ssh <host> -- tic -x -
# and then restore term=foot below.
term=xterm-256color

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

[cursor]
style=underline
unfocused-style=hollow
blink=no

[mouse]
hide-when-typing=yes

# foot >= 1.26 splits colours into [colors-dark] / [colors-light], selected by
# initial-color-theme in [main], which defaults to "dark". Only the dark section
# is defined here because this machine runs one theme and never switches.
[colors-dark]
alpha=0.92

background=002b36
foreground=839496
cursor=002b36 839496

## Normal
regular0=073642
regular1=dc322f
regular2=859900
regular3=b58900
regular4=268bd2
regular5=d33682
regular6=2aa198
regular7=eee8d5

## Bright
bright0=002b36
bright1=cb4b16
bright2=586e75
bright3=657b83
bright4=839496
bright5=6c71c4
bright6=93a1a1
bright7=fdf6e3

selection-foreground=002b36
selection-background=93a1a1

[key-bindings]
search-start=Control+Shift+f
