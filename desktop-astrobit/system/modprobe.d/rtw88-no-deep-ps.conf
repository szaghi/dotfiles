# RTL8821CE / rtw88: il Deep Power Save spegne parti del radio fra un beacon e
# l'altro e i risvegli costano decine di millisecondi. Su un link altrimenti
# sano (tx retries 0, segnale -45 dBm) e' la causa degli stutter e delle cadute
# di Moonlight/Sunshine, e degli stalli delle sessioni ssh lasciate ferme.
#
# NetworkManager non lo controlla: wifi.powersave agisce su mac80211, questo
# sta nel driver. Servono entrambi.
options rtw88_core disable_lps_deep=y
