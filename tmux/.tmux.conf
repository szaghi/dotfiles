# Mouse: wheel scrolls (enters copy mode), click selects pane, drag resizes.
# Hold Shift while dragging to use the terminal's own selection/copy.
set -g mouse on

# Scrollback per pane (default 2000).
set -g history-limit 50000

# Forward the pane title to the outer terminal (tab title). Claude Code reports
# its state there (spinner while working, ✳ when idle); with set-titles off
# tmux keeps it as #{pane_title} and the terminal tab never shows it.
set -g set-titles on
set -g set-titles-string "#T"

# Mouse copy that behaves like Windows Terminal's copyOnSelect: releasing the
# drag copies (tmux buffer + OSC 52 to the outer terminal) and keeps the
# highlight; Ctrl-C copies again and leaves copy mode, so it never reaches the
# program in the pane (Claude would read it as interrupt/clear-input). q or a
# key that cancels copy mode dismisses the selection without copying again.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi C-c send -X copy-pipe-and-cancel
bind -T copy-mode    C-c send -X copy-pipe-and-cancel

# Let programs in a pane set the clipboard with OSC 52 (default "external"
# swallows it). Claude falls back to raw OSC 52 when it does not see $TMUX
# and runs under ssh -- see claude-remote, which hides $TMUX from it.
set -s set-clipboard on
