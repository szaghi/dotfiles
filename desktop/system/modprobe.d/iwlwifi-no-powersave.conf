# power_scheme=1 (active) invece del default 2 (balanced): disattiva il
# risparmio energetico della scheda, che introduce latenza di risveglio e
# ritrasmissioni su uno stream UDP a bassa latenza (Moonlight).
#
# iwlwifi.power_save e' gia' disabilitato di default: non va impostato.
# d0i3_disable NON esiste in questo kernel: non aggiungerlo.
options iwlmvm power_scheme=1
